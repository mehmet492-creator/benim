<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kişisel Web Sayfam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <button id="theme-toggle" class="theme-btn">🌙 Gece Modu</button>
    <h1>Merhaba, Web Sayfama Hoş Geldiniz! 👋</h1>
    <p>Bu sayfa sıfırdan tasarlandı ve canlıya alındı.</p>
    <a href="#iletisim" class="btn">İletişime Geç</a>
  </header>

  <main class="container">
    <section class="card">
      <h2>🚀 Hakkımda</h2>
      <p>Web geliştirme ve tasarım süreçlerini öğrenerek kendi projelerimi hayata geçiriyorum.</p>
    </section>

    <!-- Netlify Form Bölümü -->
    <section class="card" id="iletisim">
      <h2>📬 İletişim</h2>
      <form name="contact" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="contact" />
        
        <div class="form-group">
          <label for="name">Adınız:</label>
          <input type="text" id="name" name="name" required placeholder="Adınız Soyadınız">
        </div>

        <div class="form-group">
          <label for="email">E-posta:</label>
          <input type="email" id="email" name="email" required placeholder="ornek@email.com">
        </div>

        <div class="form-group">
          <label for="message">Mesajınız:</label>
          <textarea id="message" name="message" rows="4" required placeholder="Mesajınızı buraya yazın..."></textarea>
        </div>

        <button type="submit" class="submit-btn">Gönder</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 - Tüm hakları saklıdır.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
